<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Plots</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/plots.css') }}">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <link href="https://cdn.datatables.net/v/bs5/jq-3.7.0/dt-2.3.7/r-3.0.8/sc-2.4.3/datatables.min.css" rel="stylesheet" integrity="sha384-RFcdYm0Rpd21xAb9bnIHNVUqzA/1RSoxY1SCFnwpz0ecLCgzPqTJwjzkHmmeb0Ou" crossorigin="anonymous">
</head>
<body class="bg-light">
    <div class="container py-4">
        <div class="card shadow-sm">
            <div class="card-body">
                <div class="d-flex align-items-center justify-content-between mb-3">
                    <h1 class="h3 mb-0">Plots</h1>
                    <a class="btn btn-outline-primary btn-sm" href="{{ url_for('index') }}">Back to home</a>
                </div>
                <p class="text-muted small mb-1">Plot data loaded from API endpoint.</p>
                <p class="text-muted small mb-3">Click a plot row to toggle its status via API.</p>

                <table id="plots-table" class="table table-striped table-hover table-bordered" style="width:100%">
                    <thead>
                        <tr>
                            <th>Plot ID</th>
                            <th>Location</th>
                            <th>Size (sq ft)</th>
                            <th>Raised Bed</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="plots-table-body">
                        <!-- Plot data will be inserted here by JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.0/js/bootstrap.bundle.min.js" integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz" crossorigin="anonymous"></script>
    <script src="https://cdn.datatables.net/v/bs5/jq-3.7.0/dt-2.3.7/r-3.0.8/sc-2.4.3/datatables.min.js" integrity="sha384-ItTu+vlKQk9q9uF6phRL3/QV/n9cEA3PyIFHvSjDlm7srGTWBDdNFyEXV+MluFI9" crossorigin="anonymous"></script>
    <script>
        let plotTable;
        async function loadPlots() {
            try {
                const response = await fetch("/api/plots");
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const plots = await response.json();
                renderPlotsTable(plots);
            } catch (error) {
                console.error("Error fetching plot data:", error);
                document.getElementById('plots-table-body').innerHTML = 
                    '<tr><td colspan="6" class="text-danger">Error loading plots: ' + error.message + '</td></tr>';
            }
        }

        function renderPlotsTable(plots) {
            const tbody = document.getElementById('plots-table-body');
            tbody.innerHTML = ''; // Clear existing rows

            if (!plots || plots.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="text-center">No plots found.</td></tr>';
                return;
            }

            plots.forEach(plot => {
                const row = tbody.insertRow();
                row.setAttribute('data-plot-id', plot.plotId); // Store ID for easy access
                
                // Plot ID
                row.insertCell().textContent = plot.plotId || '';
                // Location
                row.insertCell().textContent = plot.locationDescription || '';
                // Size (sq ft)
                row.insertCell().textContent = plot.sizeSqFt || '';
                // Raised Bed
                row.insertCell().textContent = plot.isRaisedBed ? 'Yes' : 'No';
                // Status (Initial state)
                const statusCell = row.insertCell();
                statusCell.textContent = plot.status || 'Pending';
                statusCell.className = plot.status === 'Active' ? 'text-success fw-bold' : 'text-warning';

                // Action Cell (Status Select)
                const actionCell = row.insertCell();
                const selectElement = document.createElement('select');
                selectElement.className = 'form-select form-select-sm';
                selectElement.setAttribute('data-plot-id', plot.plotId);
                selectElement.onchange = (event) => handleStatusChange(plot.plotId, event.target.value);
                
                // Populate options
                const options = [
                    { value: 1, text: 'Active' },
                    { value: 3, text: 'Maintainance' }
                ];
                options.forEach(option => {
                    const optionEl = document.createElement('option');
                    optionEl.value = option.value;
                    optionEl.textContent = option.text;
                    if (plot.status === option.value) {
                        optionEl.selected = true;
                    }
                    selectElement.appendChild(optionEl);
                });
                actionCell.appendChild(selectElement);
            });

            // Initialize DataTables if it hasn't been initialized yet (or re-initialize)
            if (!plotTable) {
                plotTable = $('#plots-table').DataTable({
                    "paging": true,
                    "lengthChange": true,
                    "searching": true,
                    "ordering": true,
                    "info": true,
                    "autoWidth": false
                });
            } else {
                plotTable.clear().rows.add(tbody.rows().toArray());
            }
        }

        async function updatePlotStatus(plotId, newStatusId) {
            console.log(`Attempting to update Plot ${plotId} status to: ${newStatusId}`);

            try {
                const response = await fetch("/api/plots/" + plotId + "/status", {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        // Add any necessary authentication headers here if required by the API
                    },
                    body: JSON.stringify({ status: newStatusId })
                })
                .then(response => {
                    if (!response.ok) throw new Error(`Failed to update status. HTTP status: ${response.status}`);
                    return response.json();
                });

                // Update UI immediately upon successful API call
                const row = document.querySelector(`[data-plot-id="${plotId}"]`);
                if (row) {
                    const statusCell = row.cells[4]; // Assuming Status is the 5th cell (index 4)
                    statusCell.textContent = response.newStatus;
                    statusCell.className = response.newStatus === 'Active' ? 'text-success fw-bold' : 'text-warning';
                }
            } catch (error) {
                console.error("Error updating plot status:", error);
                alert(`Failed to update status for Plot ${plotId}. Check console for details.`);
            }
        }

        async function handleStatusChange(plotId, newStatus) {
            await updatePlotStatus(plotId, newStatus);
        }

        // Initialize the application
        document.addEventListener('DOMContentLoaded', loadPlots);
    </script>
</body>
</html>
