<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gardeners</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/gardeners.css') }}">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <link href="https://cdn.datatables.net/v/bs5/jq-3.7.0/dt-2.3.7/r-3.0.8/sc-2.4.3/datatables.min.css" rel="stylesheet" integrity="sha384-RFcdYm0Rpd21xAb9bnIHNVUqzA/1RSoxY1SCFnwpz0ecLCgzPqTJwjzkHmmeb0Ou" crossorigin="anonymous">
 

</head>
<body class="bg-light">
<div class="container py-4">
    <div class="card shadow-sm">
        <div class="card-body">
            <div class="d-flex align-items-center justify-content-between mb-3">
                <h1 class="h3 mb-0">Gardeners</h1>
                <a class="btn btn-outline-primary btn-sm" href="{{ url_for('index') }}">Back to home</a>
            </div>
            <p class="text-muted small mb-1">Data loaded from repository-backed community garden API endpoints.</p>
            <p class="text-muted small mb-3">Click a row to view plot assignments. Click column headers to sort.</p>

            <table id="gardeners-table" class="table table-striped table-hover table-bordered" style="width:100%">
                <thead>
                    <tr>
                        <th></th>
                        <th>Gardener ID</th>
                        <th>First Name</th>
                        <th>Last Name</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Join Date</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.0/js/bootstrap.bundle.min.js" integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz" crossorigin="anonymous"></script>
<script src="https://cdn.datatables.net/v/bs5/jq-3.7.0/dt-2.3.7/r-3.0.8/sc-2.4.3/datatables.min.js" integrity="sha384-ItTu+vlKQk9q9uF6phRL3/QV/n9cEA3PyIFHvSjDlm7srGTWBDdNFyEXV+MluFI9" crossorigin="anonymous"></script>
<script>
    var assignmentCache = {};

    function buildAssignmentsMarkup(assignments) {
        if (!assignments.length) {
            return '<p class="panel-message">No assignments on record.</p>';
        }

        var rowsHtml = "";
        for (var i = 0; i < assignments.length; i++) {
            var a = assignments[i];
            rowsHtml += "<tr>"
                + "<td>" + (a.plotId || "") + "</td>"
                + "<td>" + (a.plotTag || "") + "</td>"
                + "<td>" + (a.locationDescription || "") + "</td>"
                + "<td>" + (a.sizeSqFt || "") + "</td>"
                + "<td>" + (a.isRaisedBed ? "Yes" : "No") + "</td>"
                + "<td>" + (a.status || "") + "</td>"
                + "<td>" + (a.startDate || "") + "</td>"
                + "<td>" + (a.endDate || "") + "</td>"
                + "<td>" + (a.notes || "") + "</td>"
                + "</tr>";
        }

        return '<table class="table table-sm table-bordered mb-0 assignment-table">'
            + '<thead class="table-light"><tr>'
            + '<th>Plot ID</th><th>Plot Tag</th><th>Location</th>'
            + '<th>Size (sq ft)</th><th>Raised Bed</th><th>Status</th>'
            + '<th>Start</th><th>End</th><th>Notes</th>'
            + '</tr></thead>'
            + '<tbody>' + rowsHtml + '</tbody>'
            + '</table>';
    }

    function loadDetail(row) {
        var data = row.data();
        var gardenerId = data.gardenerId;
        var detailRow = row.child();

        if (assignmentCache[gardenerId]) {
            row.child(assignmentCache[gardenerId]).show();
            return;
        }

        row.child('<p class="panel-message">Loading\u2026</p>').show();

        $.ajax({
            url: "/api/gardeners/" + gardenerId + "/assignments",
            dataType: "json",
            success: function(payload) {
                var markup = buildAssignmentsMarkup(payload.assignments);
                assignmentCache[gardenerId] = markup;
                row.child(markup).show();
            },
            error: function() {
                var markup = '<p class="panel-message">Unable to load assignments.</p>';
                assignmentCache[gardenerId] = markup;
                row.child(markup).show();
            }
        });
    }

    $(document).ready(function() {
        $.ajax({
            url: "/api/gardeners",
            dataType: "json",
            success: function(gardeners) {
                var table = $("#gardeners-table").DataTable({
                    data: gardeners,
                    order: [[3, "asc"]],
                    columns: [
                        {
                            className: "dt-control",
                            orderable: false,
                            data: null,
                            defaultContent: ""
                        },
                        { data: "gardenerId" },
                        { data: "firstName" },
                        { data: "lastName" },
                        { data: "email" },
                        { data: "phone" },
                        { data: "joinDate" }
                    ]
                });

                $("#gardeners-table tbody").on("click", "tr", function() {
                    var tr = $(this).closest("tr");
                    var row = table.row(tr);

                    if (row.child.isShown()) {
                        row.child.hide();
                        tr.removeClass("shown");
                    } else {
                        loadDetail(row);
                        tr.addClass("shown");
                    }
                });
            },
            error: function(_, __, err) {
                $("#gardeners-table tbody").html(
                    '<tr><td colspan="7">Error loading gardeners: ' + err + '</td></tr>'
                );
            }
        });
    });
</script>
</body>
</html>
