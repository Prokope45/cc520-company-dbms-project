name: Generate PyDoc Pages

on:
  push:
    branches: [main]
    paths:
      - 'src/**/*.py'
      - 'scripts/generate_pydoc_pages.py'
      - 'pyproject.toml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-in-project: true

      - name: Install dependencies
        run: poetry install

      - name: Generate PyDoc pages
        run: poetry run python scripts/generate_pydoc_pages.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add docs/pydoc/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "docs: regenerate pydoc pages [skip ci]"
            git push
          fi
